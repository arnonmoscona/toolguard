# TOO-45 verdict-corpus fixture (rules-dir file, ~/.toolguard/rules/). Merges
# into the SAME (user, least-specific) hierarchy level as
# home/.claude/toolguard_hook.toml, but as a DISTINCT contributing layer --
# these patterns exist ONLY here, not in that file, so resolving their
# provenance/entry must walk PAST the first (toolguard_hook.toml) layer of
# the user level to find them in this second one. See
# project/.claude/toolguard_hook.toml's comment for the overall rationale.
[permissions]
ask = [
    "Bash(rm rules-file-a.txt)",
    { match = "Bash(mv rules-file-b.txt *)", additionalContext = "Confirm the destination before moving (rules-dir rule)." },
    "Bash(chmod 777 rules-perm.txt)",
    "Bash(kill -9 5555)",
]
