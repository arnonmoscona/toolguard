# pyscn configuration file
# This file configures all analysis features of pyscn
# Place this file in your project root to customize analysis behavior

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================
[output]
format = "text"                 # Default output format: text, json, yaml, csv, html
show_details = false             # Show detailed breakdown by default
sort_by = "complexity"           # Default sort: name, complexity, risk
min_complexity = 1               # Minimum complexity to report
directory = ""                   # Output directory for reports (empty = current directory)

# =============================================================================
# COMPLEXITY ANALYSIS
# =============================================================================
[complexity]
enabled = true                   # Enable complexity analysis
low_threshold = 9                # Functions with complexity ≤ 9 are low risk
medium_threshold = 19            # Functions with complexity 10-19 are medium risk
                                # Functions with complexity ≥ 20 are high risk
max_complexity = 0               # Maximum allowed complexity (0 = no limit)
report_unchanged = true          # Report functions with complexity = 1

# =============================================================================
# DEAD CODE DETECTION
# =============================================================================
[dead_code]
enabled = true                   # Enable dead code detection
min_severity = "warning"         # Minimum severity to report: critical, warning, info
show_context = false             # Show surrounding code context
context_lines = 3                # Number of context lines to show
sort_by = "severity"             # Sort by: severity, line, file, function

# Detection options - configure what types of dead code to detect
detect_after_return = true       # Code after return statements
detect_after_break = true        # Code after break statements
detect_after_continue = true     # Code after continue statements
detect_after_raise = true        # Code after raise statements
detect_unreachable_branches = true # Unreachable conditional branches

# Patterns to ignore (regex patterns)
ignore_patterns = []

# =============================================================================
# CLONE DETECTION
# =============================================================================
[clones]
# Analysis settings
min_lines = 10                    # Minimum lines for clone candidates
min_nodes = 20                   # Minimum AST nodes for clone candidates
max_edit_distance = 50         # Maximum edit distance allowed
ignore_literals = false          # Ignore differences in literal values
ignore_identifiers = false       # Ignore differences in identifier names
cost_model_type = "python"       # Cost model: default, python, weighted

# Threshold settings for clone type classification (0.0 - 1.0)
# These values are sourced from domain/defaults.go
type1_threshold = 0.85           # Type-1: Identical code (except whitespace/comments)
type2_threshold = 0.75           # Type-2: Syntactically identical (different identifiers)
type3_threshold = 0.7           # Type-3: Syntactically similar (small modifications)
type4_threshold = 0.65           # Type-4: Functionally similar (different syntax)
similarity_threshold = 0.65       # General minimum similarity threshold

# Advanced analysis settings
enable_dfa = true                # Enable Data Flow Analysis for enhanced Type-4 detection

# Filtering settings
min_similarity = 0.0             # Minimum similarity to report
max_similarity = 1.0             # Maximum similarity to report
# enabled_clone_types = ["type1", "type2", "type4"]  # Default: uses domain.DefaultEnabledCloneTypes
max_results = 10000              # Maximum results (0 = no limit)

# Grouping settings
grouping_mode = "connected"      # Grouping mode: connected, star, complete_linkage, k_core
grouping_threshold = 0.65        # Threshold for grouping
k_core_k = 2                     # K-core parameter

# LSH acceleration settings
lsh_enabled = "auto"             # Enable LSH: true, false, auto (based on fragment or pair count)
lsh_auto_threshold = 500         # Auto-enable LSH at >= 500 fragments, or >10,000 estimated pairs
lsh_similarity_threshold = 0.5  # LSH similarity threshold
lsh_bands = 32                   # Number of LSH bands
lsh_rows = 4                     # Number of rows per band
lsh_hashes = 128                 # Number of hash functions

# Performance settings
max_memory_mb = 100              # Memory limit in MB (0 = no limit)
batch_size = 100                 # Batch size for processing
enable_batching = true           # Enable batching for large projects
max_goroutines = 4               # Maximum concurrent goroutines
timeout_seconds = 300            # Timeout for clone analysis

# Output settings
show_details = false             # Show detailed clone information
show_content = false             # Include source code content in output
sort_by = "similarity"           # Sort by: similarity, size, location, type
group_clones = true              # Group related clones together

# =============================================================================
# CBO (COUPLING BETWEEN OBJECTS) ANALYSIS
# =============================================================================
[cbo]
enabled = true                   # Enable CBO analysis
low_threshold = 3                # CBO values ≤ 3 are low risk (industry standard)
medium_threshold = 7             # CBO values 4-7 are medium risk (industry standard)
                                # CBO values > 7 are high risk
include_builtins = false         # Include built-in type dependencies
include_imports = true           # Include imported module dependencies
group_namespace_imports = true   # Collapse alias.Member references to one edge per namespace
min_cbo = 0                      # Minimum CBO to report
show_zeros = false               # Include classes with CBO = 0

# =============================================================================
# ANALYSIS CONFIGURATION
# =============================================================================
[analysis]
recursive = true                 # Recursively analyze directories
follow_symlinks = false          # Follow symbolic links
include_patterns = ["**/*.py"]      # File patterns to include
exclude_patterns = [             # File patterns to exclude
    "**/bash_parser.py",  # hits a bug in pyscn; canopy-generated, and meaningless
                          # against the style/debt questions pyscn is used for here.
                          # Pinned by test/unit/test_static_analysis_coverage.py
    "**/test_*.py",
    "**/*_test.py",
    "**/__pycache__/*",
    "**/*.pyc",
    "**/.pytest_cache/",
    ".tox/",
    "venv/",
    "env/",
    ".venv/",
    ".env/",
    "**/migrations/**"           # Django/Alembic auto-generated migration files
]
# =============================================================================
# ARCHITECTURE VALIDATION
# =============================================================================
# Define architectural layers and validate dependencies

[architecture]
enabled = true
validate_layers = true
strict_mode = true

# TOO-19 (2026-08-02): this replaced pyscn's STOCK template, which declared generic
# web-app layers (presentation/application/domain/infrastructure) matched by package
# names like "router", "service", "repository". No toolguard module matches any of
# those, so every dependency landed in "unknown layer" -- 157 violations and a 16/100
# compliance score that measured nothing. The score was an artefact of an uncustomised
# template, NOT evidence about this codebase.
#
# Layer order (each layer may import ONLY from itself and layers BELOW it):
#
#   foundation  <-  observability  <-  config  <-  engine  <-  api  <-  runtime  <-  tooling  <-  support
#
# EVERY module must appear in exactly one layer. An unlisted module is silently
# unmapped and its dependencies stop being validated, so the map degrades quietly
# rather than failing -- see tools/ for the completeness check that makes this
# deterministic instead of a matter of remembering.
#
# TOO-45 R6-S2 added "api" directly above "engine": the public decision
# interface (toolguard.api.decide) both "runtime" (the live hook's --eval
# path) and "tooling" (the replay/analysis call sites) are allowed to import
# from, clearing the one remaining direction violation (hook -> tools.decision,
# an upward import) without either caller reaching into the other's layer.

[[architecture.layers]]
name = "foundation"
# Leaves: no toolguard imports at all, or only other foundation modules.
packages = ["constants", "issues", "path_utils", "normalization", "patterns", "toml_scan", "_git", "install_provenance", "install_update", "file_lock", "tool_spec"]

[[architecture.layers]]
name = "observability"
# Cross-cutting side-effecting services: logging, error reporting, session
# warnings, update notices. These sit LOW deliberately (TOO-45, after Arnon's
# reading of the MR-08 canary). They were previously in "runtime", whose own
# comment gave the game away -- "entry points AND side-effecting concerns"
# conflates two unrelated criteria. `hook`/`session_start` belong high because
# they ORCHESTRATE; these four are leaves that happen to have side effects, and
# side-effect-ness is orthogonal to dependency direction.
#
# What the old placement cost, measured: config-layer code could not legally
# reach a logging or warning module, so four config modules hand-rolled 8
# direct stderr writes instead (config 1, env_config 2, auto_migrate 4,
# config_divergence 1 -- punch-list #01 removed the rest as a side effect
# when it rewrote auto_migrate/config_divergence onto once_per). The layering
# was not being obeyed there, it was being routed around -- and a
# zero-violation report could never show that, because the map matched the
# code. Consolidated onto `error_reporter` (TOO-45 punch-list #04).
#
# error_log and session_warnings import NOTHING from toolguard; update_check
# imports only foundation; log_writer took exactly one config-layer import
# (config.find_project_root), a thin wrapper over a foundation primitive, now
# path_utils.require_project_root. Configuration reaches log_writer by
# INJECTION already -- a plain dict parameter -- not by import. error_reporter
# imports only error_log, same-layer -- log_writer.resolve_log_dir is called
# by hook.py (runtime layer), which passes the resolved Path in, not by
# error_reporter itself (TOO-45 punch-list #04 follow-up: Reporter).
packages = ["log_writer", "error_log", "session_warnings", "update_check", "once_per_store", "once_per", "error_reporter"]

[[architecture.layers]]
name = "config"
# Owns the configuration model, discovery, validation, and the write path.
packages = ["rule_entry", "config_types", "config", "config_validation", "config_write_guard", "env_config", "rule_sort", "auto_migrate", "config_divergence", "permission_migration"]

[[architecture.layers]]
name = "engine"
# Pure decision logic: pattern matching, command decomposition, resolution.
packages = ["permissions", "compound", "resolve", "parser", "permission_resolution"]

[[architecture.layers]]
name = "api"
# The engine's public decision interface (TOO-45 R6-S2). Sits directly above
# "engine" so both "runtime" and "tooling" can legally import it downward.
packages = ["api"]

[[architecture.layers]]
name = "runtime"
# Entry points only: the modules that ORCHESTRATE a hook invocation. The
# side-effecting logging/warning services that used to share this layer now sit
# in "observability", below "config" -- see the note there.
packages = ["hook", "session_start", "subagent"]

[[architecture.layers]]
name = "tooling"
# Operator tooling behind the skills, plus one-off scripts.
packages = ["tools", "scripts"]

[[architecture.layers]]
name = "support"
# Test/experiment support. May reach anywhere; nothing may depend on it.
packages = ["testing"]

[[architecture.rules]]
from = "foundation"
allow = ["foundation"]
deny = ["observability", "config", "engine", "api", "runtime", "tooling", "support"]

# "observability" sits directly above "foundation" and BELOW "config" (TOO-45).
# That placement is the whole point: config-layer code must be able to log and
# warn through the real modules instead of hand-rolling stderr writes, which is
# what the old placement forced in four config modules.
[[architecture.rules]]
from = "observability"
allow = ["observability", "foundation"]
deny = ["config", "engine", "api", "runtime", "tooling", "support"]

[[architecture.rules]]
from = "config"
allow = ["config", "observability", "foundation"]
deny = ["engine", "api", "runtime", "tooling", "support"]

[[architecture.rules]]
from = "engine"
allow = ["engine", "config", "observability", "foundation"]
deny = ["api", "runtime", "tooling", "support"]

[[architecture.rules]]
from = "api"
allow = ["api", "engine", "config", "observability", "foundation"]
deny = ["runtime", "tooling", "support"]

[[architecture.rules]]
from = "runtime"
allow = ["runtime", "api", "engine", "config", "observability", "foundation"]
deny = ["tooling", "support"]

[[architecture.rules]]
from = "tooling"
allow = ["tooling", "runtime", "api", "engine", "config", "observability", "foundation"]
deny = ["support"]

[[architecture.rules]]
from = "support"
allow = ["support", "tooling", "runtime", "api", "engine", "config", "observability", "foundation"]


# =============================================================================
# EXAMPLE CONFIGURATIONS
# =============================================================================

# Uncomment and modify these sections for common use cases:

