[project]
name = "toolguard"
version = "0.4.0"
description = "Pre-tool-use hook permission system and security audit for Claude Code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]

toolguard = "toolguard.hook:main"
toolguard-session-start = "toolguard.session_start:main"
toolguard-update-check = "toolguard.update_check:main"
toolguard-audit = "toolguard.tools.security_audit:main"
toolguard-maintain = "toolguard.tools.maintenance:main"
toolguard-install = "toolguard.tools.installer:main"
toolguard-migrate = "toolguard.scripts.migrate_permissions:main"

[dependency-groups]
dev = [
    "ruff",
    "flake8",
    "isort",
    "code-review-graph[embeddings,communities,enrichment]"
]

[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolguard"]
