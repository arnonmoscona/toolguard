[project]
name = "toolguard"
version = "0.2.0"
description = "Pre-tool-use hook permission system for Claude Code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "flake8",
    "isort",
]

[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolguard"]
